hydra:
  run:
    dir: ${log_root_prefix}/${projname}_${now:%Y-%m-%d}_${now:%H-%M-%S}_${task_id}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - runner=2gpus
    - runner.train_batch_size=2
    - runner.max_train_steps=200000
    - resume_from_checkpoint=/mnt/ssd3/42dot/DriveArena_ssk/WorldDreamer/dreamer-log/SDv1.5_mv_single_ref_2025-09-15_23-05-55_224x400/checkpoint-150000
    - runner.checkpointing_steps=5000
    - runner.validation_steps=2500
    - runner.save_model_per_step=2500
    - runner.validation_before_run=false
    - runner.validation_index=[0,4000,15000,32632]
  job:
    name: train_lr2hr
    chdir: null
    override_dirname: resume_from_checkpoint=/mnt/ssd3/42dot/DriveArena_ssk/WorldDreamer/dreamer-log/SDv1.5_mv_single_ref_2025-09-15_23-05-55_224x400/checkpoint-150000,runner.checkpointing_steps=5000,runner.max_train_steps=200000,runner.save_model_per_step=2500,runner.train_batch_size=2,runner.validation_before_run=false,runner.validation_index=[0,4000,15000,32632],runner.validation_steps=2500,runner=2gpus
    id: ???
    num: ???
    config_name: config_nus_448_depth_no_cvatt_flatten_ref_attn_alt_hr
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.0
    version_base: '1.3'
    cwd: /mnt/ssd3/42dot/DriveArena_ssk/WorldDreamer
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /mnt/ssd3/42dot/DriveArena_ssk/WorldDreamer/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /mnt/ssd3/42dot/DriveArena_ssk/WorldDreamer/dreamer-log/SDv1.5_mv_single_ref_2025-09-18_04-23-41_448x800
    choices:
      runner: 2gpus
      accelerator: default
      dataset: Nuscenes_12hz_448_800_occ_depth
      model: SDv1.5_mv_single_ref_depth_no_cvatt_flatten_ref_attn_alt
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
